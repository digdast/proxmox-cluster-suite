apiVersion: v1
kind: Namespace
metadata:
  name: printforge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: printforge-website
  namespace: printforge
  labels:
    app: printforge-website
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: printforge-website
  template:
    metadata:
      labels:
        app: printforge-website
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      containers:
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: web-content
        hostPath:
          path: /data/appdata/3dprint-website/html
          type: Directory
      - name: nginx-conf
        hostPath:
          path: /data/appdata/3dprint-website
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: printforge-service
  namespace: printforge
  labels:
    app: printforge-website
spec:
  type: NodePort
  selector:
    app: printforge-website
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30099
    protocol: TCP
